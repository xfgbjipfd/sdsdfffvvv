<!DOCTYPE html>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .search-page-container {
            padding: 15px 10px;
            padding-bottom: 80px; 
        }
        
        .search-box-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 12px 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.25);
        }

        .search-box-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            font-family: var(--cairo-font);
            margin-right: 10px;
        }

        .search-box-wrapper i.search-icon {
            color: var(--accent);
            font-size: 16px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            display: none;
        }

        .categories-list-vertical {
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        .category-row-card {
            display: flex;
            align-items: center;
            padding: 15px 5px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInResult 0.3s ease-out forwards;
        }

        .category-row-card:last-child {
            border-bottom: none;
        }

        .category-row-card:active {
            background: rgba(255, 255, 255, 0.03);
        }

        @keyframes fadeInResult {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-icon-box {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
        }

        .category-icon-box img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .category-info {
            flex-grow: 1;
        }

        .category-info h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            font-family: 'Cairo', sans-serif;
        }

        .category-info p {
            font-size: 11px;
            color: #777;
            margin: 3px 0 0 0;
        }

        .item-price-tag {
            color: #00bfff;
            font-weight: 800;
            font-size: 13px;
            background: rgba(0, 191, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 10px;
        }

        .arrow-indicator {
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
        }
        
        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 40px 20px;
            line-height: 1.8;
        }
        
        .no-results span {
            color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>

function initSearchPage() {
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.innerHTML = `
        <div class="no-results">
            <i class="fas fa-search-plus" style="font-size: 32px; color: rgba(255,255,255,0.1); margin-bottom: 12px;"></i>
            <p>ابدأ بكتابة أي شيء تبحث عنه في المتجر..<br><span style="font-size:11px; color:#555;">مثال: شدات، رشق، تليجرام، أمريكا، بطاقات</span></p>
        </div>`;
}

window.onload = initSearchPage;

function performLiveSearch() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const resultsContainer = document.getElementById('searchResults');
    const clearBtn = document.getElementById('clearBtn');

    if (query === "") {
        clearSearch();
        return;
    }

    clearBtn.style.display = "block";
    resultsContainer.innerHTML = ""; 

    let matchesFound = 0;

    servicesDatabase.forEach(service => {
        const matchTitle = service.title.toLowerCase().includes(query);
        const matchDesc = service.desc.toLowerCase().includes(query);
        const matchKeywords = service.keywords ? service.keywords.some(keyword => keyword.toLowerCase().includes(query)) : false;

        if (matchTitle || matchDesc || matchKeywords) {
            matchesFound++;

            const card = document.createElement('div');
            card.className = 'category-row-card';
            
            card.innerHTML = `
                <div class="category-icon-box">
                    <img src="${service.img}" alt="${service.title}">
                </div>
                <div class="category-info">
                    <h3>${service.title}</h3>
                    <p>${service.desc}</p>
                </div>
                <div class="item-price-tag">${service.price}</div>
                <div class="arrow-indicator">
                    <i class="fas fa-chevron-left"></i>
                </div>
            `;

            // آلية التوجيه الاحترافية المتكاملة مع ملفات الدفع الفرعية
            card.onclick = () => {
                const targetFile = catConfig[service.cat] ? catConfig[service.cat].file : 'Games.html';
                
                const params = new URLSearchParams();
                params.append('name', service.title);
                params.append('img', service.img);
                params.append('game', service.key || 'default');

                window.location.href = `${targetFile}?${params.toString()}`;
            };

            resultsContainer.appendChild(card);
        }
    });

    if (matchesFound === 0) {
        resultsContainer.innerHTML = `
            <div class="no-results">
                لم نجد نتائج مخصصة لـ "<span>${query}</span>"<br>
                تأكد من كتابة أحرف صحيحة أو ابحث بكلمة عامة أخرى.
            </div>`;
    }
}

function clearSearch() {
    document.getElementById('searchInput').value = "";
    document.getElementById('clearBtn').style.display = "none";
    initSearchPage();
    document.getElementById('searchInput').focus();
}
</script>
